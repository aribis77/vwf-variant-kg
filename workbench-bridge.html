<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VWF Workbench analysis</title><style>body{font:16px system-ui;max-width:1050px;margin:30px auto;padding:0 16px;color:#203247}iframe{width:100%;height:72vh;border:1px solid #ccd7e2;border-radius:8px}button,a{padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f9;padding:16px}small{color:#566}</style><h1>VWF structural and energy analysis</h1><p id="status">Loading Protein Workbench…</p><p><a id="back" href="./">Return to variant report</a></p><iframe id="workbench" title="Protein Workbench"></iframe><h2>Captured Workbench results</h2><pre id="results">Waiting for a completed Workbench JSON report.</pre><script>
const q=new URLSearchParams(location.search),variant=(q.get('variant')||'H1786D').toUpperCase(),pdb=q.get('pdb')||'4DMU',chain=q.get('chain')||'B';
const back=document.getElementById('back');back.href='./?variant='+encodeURIComponent(variant);
const frame=document.getElementById('workbench');const status=document.getElementById('status');
const url=new URL('/protein-workbench/',location.origin);url.searchParams.set('pdb',pdb);url.searchParams.set('mutation',variant);url.searchParams.set('chain',chain);url.searchParams.set('analysis',q.get('analysis')||'combined');if(q.get('alignment_url'))url.searchParams.set('alignment_url',q.get('alignment_url'));
function acceptReport(obj){if(!obj||typeof obj!=='object')return;const txt=JSON.stringify(obj);if(obj.schema!=='protein-workbench-mechanistic-report/0.1'||obj.mutation!==variant||!obj.coordinate_mapping?.verified_in_loaded_structure)return;try{sessionStorage.setItem('vwf-last-workbench-report',txt);localStorage.setItem('vwf-last-workbench-report',txt)}catch(e){}document.getElementById('results').textContent=JSON.stringify(obj,null,2);status.textContent='Workbench report captured. Return to the variant report to see imported evidence.';}
frame.addEventListener('load',()=>{try{const w=frame.contentWindow;const original=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=function(blob){if(blob&&/json/i.test(blob.type||'')){blob.text().then(t=>{try{acceptReport(JSON.parse(t))}catch(e){}})}return original(blob)};status.textContent='Workbench loaded. Run the combined analysis; its exported JSON will be captured automatically.';}catch(e){status.textContent='Workbench loaded, but browser security prevented automatic capture. Both pages must use the same origin.';}});
frame.src=url.href;
</script></html>
