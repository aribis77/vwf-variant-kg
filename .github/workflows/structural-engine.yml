name: Structural engine unit tests
on:
  push:
    paths:
      - 'analysis/structural_contacts.py'
      - 'analysis/run_h1786d.py'
      - 'analysis/model_h1786d.py'
      - 'analysis/render_variant_report.py'
      - 'analysis/conservation.py'
      - 'analysis/build_h1786d_conservation.py'
      - 'tests/test_conservation.py'
      - 'tests/test_variant_report.py'
      - 'tests/test_structural_contacts.py'
      - '.github/workflows/structural-engine.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  structural-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute unit tests and retain diagnostic output
        id: tests
        run: |
          mkdir -p analysis/ci-diagnostics
          set +e
          python -m unittest discover -s tests -p 'test_structural_contacts.py' -v > analysis/ci-diagnostics/structural-tests.log 2>&1
          structural=$?
          python -m unittest discover -s tests -p 'test_variant_report.py' -v > analysis/ci-diagnostics/report-tests.log 2>&1
          report=$?
          python -m unittest discover -s tests -p 'test_conservation.py' -v > analysis/ci-diagnostics/conservation-tests.log 2>&1
          conservation=$?
          for file in analysis/ci-diagnostics/*.log; do echo "===== $file ====="; cat "$file"; done
          printf 'structural=%s report=%s conservation=%s\\n' "$structural" "$report" "$conservation" > analysis/ci-diagnostics/summary.txt
          if [ "$structural" -ne 0 ] || [ "$report" -ne 0 ] || [ "$conservation" -ne 0 ]; then exit 1; fi
      - name: Analyse experimental H1786D site in 4DMU
        run: python analysis/run_h1786d.py
      - name: Verify real structure report and publish readable summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("analysis/H1786D_contacts.json").read_text())
          assert d["mutation"]=="H1786D" and d["site"]["wild_type_verified"] is True
          assert d["wild_type_contacts"]["partner_count"]>0, "No structural neighbors measured"
          assert d["energetics"] is None and d["mutant_contacts"] is None
          lines=["## H1786D experimental WT structural contacts",
                 "PDB: 4DMU, chain B, author residue 1786 (H)",
                 "",
                 "| Partner | Residue | Minimum distance (Å) | Atom pairs | Interchain |",
                 "|---|---|---:|---:|---|"]
          for p in d["wild_type_contacts"]["partner_residues"]:
              lines.append(f'| {p["chain"]}:{p["author_residue"]}{p["insertion_code"]} | {p["residue"]} | {p["minimum_distance_angstrom"]} | {p["atom_pairs"]} | {p["inter_chain"]} |')
          lines+=["","**Scope:** wild-type contacts only; no modeled H1786D or ΔΔG yet."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\\n".join(lines)+"\\n")
          print("\\n".join(lines))
          PY
      - name: Install mutation modeling tools
        id: modeling_dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install openmm
          python -m pip install git+https://github.com/openmm/pdbfixer.git
      - name: Generate H1786D model and compare coordinates
        if: steps.modeling_dependencies.outcome == 'success'
        continue-on-error: true
        run: python analysis/model_h1786d.py
      - name: Install MAFFT for sequence conservation
        id: mafft
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y mafft
      - name: Compute H1786 conservation from reviewed UniProt orthologs
        if: steps.mafft.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p analysis/ci-diagnostics
          python -m analysis.build_h1786d_conservation --output analysis/H1786D_conservation.json 2>&1 | tee analysis/ci-diagnostics/conservation-run.log
          exit ${PIPESTATUS[0]}
      - name: Merge validated conservation evidence when available
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          conservation_path=Path("analysis/H1786D_conservation.json")
          if not conservation_path.is_file():
              print("No curated H1786D conservation dataset available; retaining null.")
          else:
              c=json.loads(conservation_path.read_text())
              assert c["position"]==1786 and c["wild_type"]=="H"
              assert c["ortholog_count"]>=5
              assert 0<=c["reference_residue_fraction"]<=1
              for name in ("H1786D_contacts.json","H1786D_model_comparison.json"):
                  path=Path("analysis")/name
                  if path.is_file():
                      d=json.loads(path.read_text())
                      assert d["mutation"]=="H1786D" and d["site"]["wild_type_verified"]
                      d["conservation"]=c
                      path.write_text(json.dumps(d,indent=2)+"\\n")
          PY
      - name: Render readable H1786D report
        if: always()
        run: |
          if [ -s analysis/H1786D_model_comparison.json ]; then
            python analysis/render_variant_report.py --input analysis/H1786D_model_comparison.json --output analysis/H1786D_report.html
          elif [ -s analysis/H1786D_contacts.json ]; then
            python analysis/render_variant_report.py --input analysis/H1786D_contacts.json --output analysis/H1786D_report.html
          fi
      - name: Copy validated report into website
        if: success() && hashFiles('analysis/H1786D_contacts.json', 'analysis/H1786D_report.html') != ''
        run: |
          cp analysis/H1786D_report.html H1786D_report.html
          mkdir -p data/variants
          if [ -s analysis/H1786D_model_comparison.json ]; then
            cp analysis/H1786D_model_comparison.json data/variants/H1786D.json
          else
            cp analysis/H1786D_contacts.json data/variants/H1786D.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add H1786D_report.html data/variants/H1786D.json
          git diff --cached --quiet || (git commit -m "Publish H1786D structural evidence" && git push)
      - name: Publish failure diagnostics for remote inspection
        if: failure()
        run: |
          mkdir -p analysis/ci-diagnostics
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > analysis/ci-diagnostics/run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ci-diagnostics/
          git diff --cached --quiet || (git commit -m "Record structural CI failure diagnostics [skip ci]" && git push)
      - name: Preserve conservation analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1786D-conservation-evidence
          path: analysis/H1786D_conservation.json
          if-no-files-found: warn
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-ci-diagnostics
          path: analysis/ci-diagnostics/
          if-no-files-found: warn
      - name: Upload readable H1786D report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1786D-readable-structural-report
          path: analysis/H1786D_report.html
          if-no-files-found: warn
      - name: Preserve WT-mutant model comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H1786D-unrelaxed-model-comparison
          path: |
            analysis/H1786D_model_comparison.json
            analysis/4DMU_H1786D_unrelaxed.pdb
          if-no-files-found: warn
      - name: Preserve measured contact report
        uses: actions/upload-artifact@v4
        with:
          name: H1786D-measured-WT-contacts
          path: analysis/H1786D_contacts.json
