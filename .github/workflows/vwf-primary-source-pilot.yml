name: VWF primary-source pilot retrieval
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ingest_vwf_pilot.py'
      - 'scripts/audit_vwf_pilot.py'
      - 'scripts/build_vwf_source_summary.py'
      - 'tests/test_vwf_source_audit.py'
      - 'tests/test_vwf_source_summary.py'
      - 'tests/validate_multisource_evidence.py'
      - 'data/multisource-evidence.json'
      - '.github/workflows/vwf-primary-source-pilot.yml'
  schedule:
    - cron: '17 6 1 * *'
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current evidence snapshot
        run: python tests/validate_multisource_evidence.py
      - name: Run offline audit regression tests
        run: |
          python tests/test_vwf_source_audit.py
          python tests/test_vwf_source_summary.py
      - name: Fetch source payloads (not automatically published)
        run: python scripts/ingest_vwf_pilot.py --out-dir data/pilot_raw
      - name: Audit primary records without automatic promotion
        run: python scripts/audit_vwf_pilot.py --raw-dir data/pilot_raw
      - name: Build read-only audit summary
        if: success()
        run: python scripts/build_vwf_source_summary.py --audit data/pilot_raw/audit.json --output data/pilot_raw/source-audit-summary.json
      - name: Summarize verification status
        if: always()
        run: |
          if [ -f data/pilot_raw/audit.json ]; then
            python -c 'import json; d=json.load(open("data/pilot_raw/audit.json")); print("## VWF primary-source audit\\n", file=open("/dev/stdout","w")); [print("-", x["variant"], x["status"]) for x in d["reconciliation"]]'
          else
            echo "Primary-source audit unavailable; ingestion not verified."
          fi
      - name: Upload raw source records and audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vwf-primary-source-pilot
          path: data/pilot_raw/
          retention-days: 30
