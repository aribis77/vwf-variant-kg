name: Benchmark metadata checks
on:
  push:
    paths:
      - 'benchmark/**'
      - 'tests/check_benchmark_metadata.py'
      - 'tests/check_blind_manifest.py'
      - 'tests/check_source_cluster_audit.py'
      - 'tests/check_evaluation_gate.py'
      - 'tests/check_prediction_contract.py'
      - 'tests/check_source_exclusions.py'
      - 'tests/check_evaluation_snapshot.py'
      - 'tests/check_evaluation_graph.py'
      - 'tests/check_publication_identities.py'
      - 'tests/check_internal_source_provenance.py'
      - 'benchmark/audit_source_clusters.py'
      - '.github/workflows/benchmark-metadata.yml'
  pull_request:
    paths:
      - 'benchmark/**'
      - 'tests/check_benchmark_metadata.py'
      - '.github/workflows/benchmark-metadata.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate benchmark metadata
        run: python tests/check_benchmark_metadata.py
      - name: Generate benchmark case manifest
        run: python benchmark/prepare_blind_manifest.py
      - name: Check generated manifest
        run: python tests/check_blind_manifest.py
      - name: Audit publication and variant clusters
        run: python benchmark/audit_source_clusters.py
      - name: Check source cluster audit
        run: python tests/check_source_cluster_audit.py
      - name: Enforce evaluation eligibility gate
        run: python tests/check_evaluation_gate.py
      - name: Validate prediction evaluation contract
        run: python tests/check_prediction_contract.py
      - name: Build reference source exclusions
        run: python benchmark/build_source_exclusions.py
      - name: Check reference source exclusions
        run: python tests/check_source_exclusions.py
      - name: Audit reference overlap in embedded KG
        run: python benchmark/audit_embedded_kg_overlap.py
      - name: Build quarantined evaluation snapshot
        run: python benchmark/build_evaluation_snapshot.py
      - name: Verify quarantined evaluation snapshot
        run: python tests/check_evaluation_snapshot.py
      - name: Build fail-closed evaluation graph
        run: python benchmark/build_evaluation_graph.py
      - name: Verify evaluation graph
        run: python tests/check_evaluation_graph.py
      - name: Audit publication identifiers and unresolved aliases
        run: python benchmark/audit_publication_identities.py
      - name: Verify publication identity audit
        run: python tests/check_publication_identities.py
      - name: Resolve internal graph source provenance
        run: python benchmark/resolve_internal_sources.py
      - name: Verify internal graph source provenance
        run: python tests/check_internal_source_provenance.py
      - name: Archive evaluation design manifest
        uses: actions/upload-artifact@v4
        with:
          name: vwf-provisional-case-manifest
          path: |
            benchmark/blind_manifest.json
            benchmark/source_cluster_audit.json
            benchmark/reference_source_exclusions.json
            benchmark/embedded_kg_overlap_audit.json
            benchmark/evaluation_evidence_snapshot.json
            benchmark/evaluation_graph_snapshot.json
            benchmark/publication_identity_audit.json
            benchmark/internal_source_provenance.json
          retention-days: 30
