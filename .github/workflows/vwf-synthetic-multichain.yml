name: Synthetic multichain CHARMM36 chemistry
on:
  push:
    branches: [vwf-md-automation]
    paths:
      - simulation/test_synthetic_multichain.py
      - .github/workflows/vwf-synthetic-multichain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chemistry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "openmm>=8.2,<9"
      - name: Construct synthetic collagen and disulfide systems
        run: python simulation/test_synthetic_multichain.py
      - name: Store chemistry test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-multichain-report
          path: simulation/synthetic_multi_chain_report.json
          if-no-files-found: error
